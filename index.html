<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GYM20MUSIC | Power • Focus • Energy</title>

  <meta name="description"
        content="GYM20MUSIC - Workout Music, Focus Music and Energy Music for training, motivation and focus. Join us on Telegram.">

  <meta name="keywords"
        content="GYM20MUSIC, workout music, gym music, focus music, training music, energy music">

  <meta name="robots" content="index, follow">

  <meta property="og:title" content="GYM20MUSIC | Power • Focus • Energy">
  <meta property="og:description"
        content="Workout Music • Focus Music • Energy Music">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, #202020 0%, #0d0d0d 38%, #050505 100%);
      color: #ffffff;
      font-family: "Montserrat", "Vazirmatn", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255,255,255,0.025) 50%,
          transparent 100%
        );
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 30px 20px;
      text-align: center;
    }

    .logo {
      width: 86px;
      height: 86px;
      margin: 0 auto 28px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #252525, #0d0d0d);
      box-shadow:
        0 0 40px rgba(255,255,255,0.06),
        inset 0 0 25px rgba(255,255,255,0.04);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 82px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -3px;
    }

    .tagline {
      margin-top: 22px;
      font-size: clamp(15px, 3vw, 21px);
      font-weight: 600;
      letter-spacing: 5px;
      color: #d7d7d7;
    }

    .description {
      max-width: 650px;
      margin: 28px auto 0;
      color: #a9a9a9;
      font-size: 17px;
      line-height: 1.8;
    }

    .features {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .feature {
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50px;
      background: rgba(255,255,255,0.035);
      color: #cfcfcf;
      font-size: 13px;
      font-weight: 600;
    }

    .telegram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 38px;
      padding: 16px 30px;
      min-width: 240px;
      border-radius: 14px;
      background: #229ed9;
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 12px 35px rgba(34,158,217,0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .telegram-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 45px rgba(34,158,217,0.35);
    }

    .telegram-icon {
      font-size: 21px;
    }

    footer {
      margin-top: 70px;
      color: #666;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 18px;
      }

      .logo {
        width: 72px;
        height: 72px;
        font-size: 24px;
      }

      .tagline {
        letter-spacing: 3px;
      }

      .description {
        font-size: 15px;
      }

      .telegram-btn {
        width: 100%;
        max-width: 330px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">G20</div>

    <h1>GYM20MUSIC</h1>

    <div class="tagline">
      POWER • FOCUS • ENERGY
    </div>

    <p class="description">
      Workout Music for Training, Motivation and Focus
    </p>

    <div class="features">
      <div class="feature">WORKOUT</div>
      <div class="feature">FOCUS</div>
      <div class="feature">ENERGY</div>
      <div class="feature">MOTIVATION</div>
    </div>

    <a
      class="telegram-btn"
      href="https://t.me/GYM20MUSIC"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="telegram-icon">✈</span>
      Join Telegram Channel
    </a>

    <footer>
      © 2026 GYM20MUSIC
    </footer>

  </main>

</body>
</html>
